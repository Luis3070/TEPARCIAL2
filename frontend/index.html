<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10263f" />
    <meta name="description" content="EH4000 Structural Integrity Management" />
    <title>EH4000 Integrity | Structural Integrity Management</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#f3f5f7;color:#344a5c;font:15px Arial,sans-serif">
        <div style="max-width:440px;padding:28px;text-align:center;background:#fff;border:1px solid #e4e9ed;border-radius:12px;box-shadow:0 8px 28px #20334412">
          <strong style="font-size:20px;color:#142b43">EH4000 · Structural Integrity</strong>
          <p id="startup-message" style="line-height:1.6;color:#657987">Iniciando el dashboard…</p>
          <noscript>JavaScript debe estar habilitado para mostrar el dashboard.</noscript>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(() => {
        const message = document.getElementById('startup-message')
        if (message) message.textContent = 'La interfaz no inició. Comprueba que el servidor esté activo y recarga la página.'
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
