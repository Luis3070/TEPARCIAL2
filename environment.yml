  # Historical QA and spreadsheet ingestion
  - numpy>=1.26,<2.4
  - pandas>=2.2,<3
  - matplotlib>=3.8,<4
  - openpyxl>=3.1,<4
  # Planned Python API and relational persistence
  - fastapi>=0.115,<1
  - uvicorn>=0.30,<1
  - sqlalchemy>=2,<3
  - pydantic>=2.8,<3
